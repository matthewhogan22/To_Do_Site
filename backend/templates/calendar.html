<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calendar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='calendar.css') }}">

        <h1 class="site-header">

                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
                <th>Sat</th>
            </tr>
            <tr id="week1">
                <td id="day1"></td>
                <td id="day2"></td>
                <td id="day3"></td>
                <td id="day4"></td>
                <td id="day5"></td>
                <td id="day6"></td>
                <td id="day7"></td>
            </tr>
            <tr id="week2">

                <td id="day9"></td>
                <td id="day10"></td>
                <td id="day11"></td>
                <td id="day12"></td>
                <td id="day13"></td>
                <td id="day14"></td>
            </tr>
            <tr id="week3">

                <td id="day16"></td>
                <td id="day17"></td>
                <td id="day18"></td>
                <td id="day19"></td>

                <td id="day21"></td>
            </tr>
            <tr id="week4">
                <td id="day22"></td>
                <td id="day23"></td>

                <td id="day28"></td>
            </tr>
            <tr id="week5">

                <td id="day30"></td>

                <td id="day32"></td>
                <td id="day33"></td>
                <td id="day34"></td>
                <td id="day35"></td>
            </tr>
            <tr id="week6">
                <td id="day36"></td>
                <td id="day37"></td>
                <td id="day38"></td>
                <td id="day39"></td>
                <td id="day40"></td>
                <td id="day41"></td>
                <td id="day42"></td>
            </tr>
        </table>
    </div>
</body>
</html>
